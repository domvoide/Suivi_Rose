.tap{transition:transform .14s ease,background-color .2s,color .2s,border-color .2s,box-shadow .2s;}

.row:active{background:var(--press);}
.page{animation:fadeUp .3s cubic-bezier(.2,.8,.3,1) both;}

.stagger>*:nth-child(2){animation-delay:.04s}.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.12s}.stagger>*:nth-child(5){animation-delay:.16s}.stagger>*:nth-child(n+6){animation-delay:.2s}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@keyframes fadeOut{from{opacity:1}to{opacity:0}}

function pad(n){return String(n).padStart(2,"0");}
function localNow(){const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function localHoursBefore(h){const d=new Date(Date.now()-h*3600000);return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function isoToLocal(iso){const d=new Date(iso);return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function localToIso(s){return new Date(s).toISOString();}

const MOODS=["😴","😊","😢","😤","😌","🤔"];

function fmtTime(iso){return new Date(iso).toLocaleTimeString("fr-CH",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Zurich"});}
function fmtDate(iso){
  const d=new Date(iso),now=new Date();
  const ds=d.toLocaleDateString("fr-CH",{timeZone:"Europe/Zurich"});
  const ns=now.toLocaleDateString("fr-CH",{timeZone:"Europe/Zurich"});
  const ys=new Date(now-86400000).toLocaleDateString("fr-CH",{timeZone:"Europe/Zurich"});
  if(ds===ns)return"Aujourd'hui";if(ds===ys)return"Hier";
  return d.toLocaleDateString("fr-CH",{weekday:"short",day:"numeric",month:"short",timeZone:"Europe/Zurich"});
}
function fmtShortDate(iso){
  const d=new Date(iso);
  return`${pad(+d.toLocaleDateString("fr-CH",{day:"numeric",timeZone:"Europe/Zurich"}))}.${pad(+d.toLocaleDateString("fr-CH",{month:"numeric",timeZone:"Europe/Zurich"}))}`;
}
function durLabel(m){if(!m)return"";return m<60?`${m} min`:`${Math.floor(m/60)}h${pad(m%60)}`;}
function timeAgo(iso){
  const m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<1)return"à l'instant";if(m<60)return`il y a ${m} min`;
  const h=Math.floor(m/60),rm=m%60;
  return rm>0?`il y a ${h}h${pad(rm)}`:`il y a ${h}h`;
}
function dateZH(iso){return new Date(iso).toLocaleDateString("fr-CH",{timeZone:"Europe/Zurich"});}
function todayZH(){return new Date().toLocaleDateString("fr-CH",{timeZone:"Europe/Zurich"});}
function groupByDay(entries){
  const g={};
  [...entries].sort((a,b)=>new Date(b.ts)-new Date(a.ts)).forEach(e=>{const k=dateZH(e.ts);if(!g[k])g[k]=[];g[k].push(e);});
  return g;
}
function groupFeeds(list){
  const feeds=[...list].filter(e=>e.cat==="feed").sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const sessions=[];let i=0;
  while(i<feeds.length){
    const cur=feeds[i];
    if(i+1<feeds.length){
      const nxt=feeds[i+1];
      const diff=(new Date(nxt.ts)-new Date(cur.ts))/60000;
      const sides=new Set([cur.side,nxt.side]);
      if(diff<=30&&sides.has("Gauche")&&sides.has("Droit")){sessions.push({...cur,side:"Les deux",_merged:true});i+=2;continue;}
    }
    sessions.push(cur);i++;
  }
  return sessions;
}
function checkMorningSoins(entries){
  const today=todayZH();
  const te=entries.filter(e=>dateZH(e.ts)===today);
  return{
    vitDone:te.some(e=>e.cat==="vitamin"&&e.vitaminDone),
    nombrilDone:te.some(e=>e.cat==="nombril"),
    probioticDone:te.some(e=>e.cat==="probiotic"),
  };
}
function calcNightDuration(allEntries){
  function longestPause(ws,we){
    const inW=allEntries.filter(e=>{const t=new Date(e.ts);return t>=ws&&t<=we;}).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    if(inW.length<2)return null;
    let max=0;
    for(let i=1;i<inW.length;i++){const g=(new Date(inW[i].ts)-new Date(inW[i-1].ts))/60000;if(g>max)max=g;}
    return max>=60?Math.round(max):null;
  }
  const now=new Date();
  const ws0=new Date(now);ws0.setHours(20,0,0,0);if(ws0>now)ws0.setDate(ws0.getDate()-1);
  const we0=new Date(ws0);we0.setDate(we0.getDate()+1);we0.setHours(11,0,0,0);
  const cur=longestPause(ws0,we0);if(cur)return cur;
  const ws1=new Date(ws0);ws1.setDate(ws1.getDate()-1);
  const we1=new Date(we0);we1.setDate(we1.getDate()-1);
  return longestPause(ws1,we1);
}

// Icônes au trait (menu du bas)
const ICONS={

};
const Icon=({name,size=22})=>(<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">{ICONS[name]}</svg>);

// ─── Éléments d'interface ────────────────────────────────────────────────────
const Btn=({color,children,onClick,style={},ghost})=>(<button className="tap" onClick={onClick} style={{background:ghost?C.surface:color,color:ghost?C.muted:"#fff",border:ghost?`1.5px solid ${C.border}`:"none",borderRadius:16,padding:"15px 22px",fontWeight:800,fontSize:16,cursor:"pointer",boxShadow:ghost?"none":`0 8px 18px -8px ${color}`,...style}}>{children}</button>);
const SmallBtn=({color,children,onClick,ghost})=>(<button className="tap" onClick={onClick} style={{background:ghost?"transparent":color,color:ghost?C.muted:"#fff",border:ghost?`1.5px solid ${C.border}`:"none",borderRadius:12,padding:"8px 14px",fontWeight:800,fontSize:13,cursor:"pointer"}}>{children}</button>);
const Label=({children})=>(<span style={{fontSize:13,fontWeight:800,color:C.muted}}>{children}</span>);
const iSt={border:`1.5px solid ${C.border}`,borderRadius:14,padding:"12px 14px",fontSize:16,background:C.bg,color:C.text,outline:"none",width:"100%",boxSizing:"border-box",transition:"border-color .2s, box-shadow .2s"};
const Inp=({label,...p})=>(<label style={{display:"flex",flexDirection:"column",gap:7}}><Label>{label}</Label><input {...p} style={iSt}/></label>);
const Sel=({label,children,...p})=>(<label style={{display:"flex",flexDirection:"column",gap:7}}><Label>{label}</Label><select {...p} style={iSt}>{children}</select></label>);
const Form=({children})=>(<div style={{display:"flex",flexDirection:"column",gap:18}}>{children}</div>);

const Card=({children,style={},onClick,className})=>(<div onClick={onClick} className={className} style={{background:C.surface,borderRadius:22,boxShadow:C.shadow,...style}}>{children}</div>);

// Choix sous forme de pastilles (remplace les listes déroulantes)
function Chips({label,options,value,onChange,color=C.accent}){
  return(<div style={{display:"flex",flexDirection:"column",gap:8}}>
    {label&&<Label>{label}</Label>}
    <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
      {options.map(o=>{const v=typeof o==="string"?o:o.value,l=typeof o==="string"?o:o.label,on=value===v;return(

      );})}
    </div>
  </div>);
}
// Raccourcis de valeurs (ex : 5 / 10 / 15 min)
function QuickPicks({values,suffix,onPick,current}){
  return(<div style={{display:"flex",gap:6,marginTop:-8}}>
    {values.map(v=>(<button key={v} className="tap" onClick={()=>onPick(String(v))} style={{flex:1,padding:"7px 0",borderRadius:10,border:"none",background:String(current)===String(v)?C.accentLight:C.bg,color:String(current)===String(v)?C.accent:C.muted,fontWeight:800,fontSize:12,cursor:"pointer"}}>{v}{suffix}</button>))}
  </div>);
}

// Feuille qui glisse depuis le bas (formulaires, détails)
let scrollLocks=0;
function lockScroll(){if(scrollLocks++===0)document.body.style.overflow="hidden";return()=>{if(--scrollLocks===0)document.body.style.overflow="";};}
function Sheet({title,onClose,children}){
  const[closing,setClosing]=useState(false);
  const[dy,setDy]=useState(0);
  const startY=useRef(null);
  useEffect(lockScroll,[]);
  function close(){if(closing)return;setClosing(true);setTimeout(onClose,200);}
  const drag={
    onTouchStart:e=>{startY.current=e.touches[0].clientY;},
    onTouchMove:e=>{if(startY.current!=null)setDy(Math.max(0,e.touches[0].clientY-startY.current));},
    onTouchEnd:()=>{startY.current=null;if(dy>90)close();else setDy(0);},
  };
  return ReactDOM.createPortal(
    <div onClick={e=>{if(e.target===e.currentTarget)close();}} style={{position:"fixed",inset:0,background:"rgba(24,18,48,0.38)",backdropFilter:"blur(3px)",WebkitBackdropFilter:"blur(3px)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200,animation:`${closing?"fadeOut .2s ease forwards":"fadeIn .2s ease"}`}}>
      <div style={{background:C.surface,borderRadius:"28px 28px 0 0",width:"100%",maxWidth:480,maxHeight:"90vh",display:"flex",flexDirection:"column",boxShadow:"0 -12px 40px rgba(24,18,48,.16)",transform:dy?`translateY(${dy}px)`:undefined,transition:dy&&startY.current!=null?"none":"transform .25s ease",animation:closing?"sheetOut .2s ease-in forwards":"sheetIn .34s cubic-bezier(.2,.9,.3,1) backwards"}}>
        <div {...drag} style={{padding:"10px 20px 0",touchAction:"none"}}>
          <div style={{width:42,height:5,borderRadius:3,background:C.border,margin:"0 auto 14px"}}/>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
            <div style={{fontSize:20,fontWeight:900,letterSpacing:-.2}}>{title}</div>
            <button className="tap" onClick={close} aria-label="Fermer" style={{width:36,height:36,borderRadius:18,border:"none",background:C.bg,color:C.muted,fontSize:22,lineHeight:1,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
          </div>
        </div>
        <div style={{overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"0 20px calc(28px + env(safe-area-inset-bottom))"}}>{children}</div>
      </div>
    </div>,document.body);
}

// ─── Formulaires ─────────────────────────────────────────────────────────────
function FeedForm({onSave,initial,simple,preset}){
  const[side,setSide]=useState(initial?.side||preset?.side||"Gauche");
  const[dur,setDur]=useState(initial?.duration||"");
  const[qty,setQty]=useState(initial?.quantity||"");
  const[note,setNote]=useState(initial?.note||"");
  const[ts,setTs]=useState(initial?isoToLocal(initial.ts):localNow());
  return(<Form>
    <Chips label="Sein" options={["Gauche","Droit","Les deux","Biberon"]} value={side} onChange={setSide}/>
    <Inp label="Durée (min)" type="number" inputMode="numeric" min="0" value={dur} onChange={e=>setDur(e.target.value)} placeholder="ex: 15"/>
    <QuickPicks values={[5,10,15,20,30]} suffix=" min" current={dur} onPick={setDur}/>
    {(side==="Biberon"||qty)&&<Inp label="Quantité (ml)" type="number" inputMode="numeric" min="0" value={qty} onChange={e=>setQty(e.target.value)} placeholder="ex: 90"/>}
    {!simple&&<Inp label="Note" value={note} onChange={e=>setNote(e.target.value)} placeholder="optionnel"/>}
    <Inp label="Heure" type="datetime-local" value={ts} onChange={e=>setTs(e.target.value)}/>
    <Btn color={C.accent} onClick={()=>onSave({cat:"feed",side,duration:dur?+dur:null,quantity:qty?+qty:null,note:note||undefined,ts:localToIso(ts)})}>{initial?"Modifier":"Enregistrer"}</Btn>
  </Form>);
}
function PumpForm({onSave,initial}){
  const[side,setSide]=useState(initial?.side||"Les deux");
  const[qty,setQty]=useState(initial?.quantity||"");
  const[dur,setDur]=useState(initial?.duration||"");
  const[note,setNote]=useState(initial?.note||"");
  const[ts,setTs]=useState(initial?isoToLocal(initial.ts):localNow());
  return(<Form>
    <Chips label="Sein" options={["Les deux","Gauche","Droit"]} value={side} onChange={setSide}/>
    <Inp label="Quantité (ml)" type="number" inputMode="numeric" min="0" step="5" value={qty} onChange={e=>setQty(e.target.value)} placeholder="ex: 60"/>
    <Inp label="Durée (min)" type="number" inputMode="numeric" min="0" value={dur} onChange={e=>setDur(e.target.value)} placeholder="ex: 15"/>
    <QuickPicks values={[10,15,20,30]} suffix=" min" current={dur} onPick={setDur}/>

function entryParts(entry){
  const parts=[];
  if(entry.side)parts.push(entry.side==="Les deux"?"Les deux seins":entry.side==="Biberon"?"Biberon":`Sein ${entry.side.toLowerCase()}`);
  if(entry.duration)parts.push(durLabel(entry.duration));
  if(entry.quantity)parts.push(`${entry.quantity} ml`);
  if(entry.weight)parts.push(`${entry.weight} kg`);
  if(entry.temp)parts.push(`${entry.temp} °C`);
  if(entry.pooColor)parts.push(entry.pooColor);
  if(entry.pooTex)parts.push(entry.pooTex);
  if(entry.mood)parts.push(entry.mood);
  if(entry.note)parts.push(entry.note);
  if(entry.author)parts.push(`— ${entry.author}`);
  return parts;
}

  const last=ws[ws.length-1],prev=ws[ws.length-2];

        </svg>

function PDFReport({data,onClose}){
  const entries=data.entries;
  const weights=entries.filter(e=>e.cat==="weight").sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const now=new Date();
  function byDay(n){const days=[];for(let i=n-1;i>=0;i--){const d=new Date(now.getTime()-i*86400000);const k=d.toLocaleDateString("fr-CH",{timeZone:"Europe/Zurich"});days.push({k,d});}return days;}
  const days7=byDay(7);
  const statsRows=days7.map(({k,d})=>{
    const dayE=entries.filter(e=>dateZH(e.ts)===k);
    return{k,d,feeds:groupFeeds(dayE).length,wet:dayE.filter(e=>e.cat==="diaper_wet"||e.cat==="diaper_both").length,poo:dayE.filter(e=>e.cat==="diaper_poo"||e.cat==="diaper_both").length,vit:dayE.some(e=>e.cat==="vitamin"&&e.vitaminDone),prob:dayE.some(e=>e.cat==="probiotic"),nom:dayE.some(e=>e.cat==="nombril"),label:d.toLocaleDateString("fr-CH",{weekday:"short",day:"numeric",month:"short"})};
  });
  const minW=weights.length?Math.min(...weights.map(e=>e.weight)):null;
  const lastW=weights.length?weights[weights.length-1]:null;
  const firstW=weights.length?weights[0]:null;
  const weightGain=minW&&lastW?Math.round((lastW.weight-minW)*1000):null;
  const minWEntry=weights.find(e=>e.weight===minW);
  const daysSince=minWEntry&&lastW?Math.round((new Date(lastW.ts)-new Date(minWEntry.ts))/86400000):null;
  const dailyGain=weightGain&&daysSince?Math.round(weightGain/daysSince):null;
  // Nuits 7j pour le PDF
  function calcNightDurPDF(dayK,nextDayK){
    const inW=entries.filter(e=>{const h=new Date(e.ts).getHours();return(dateZH(e.ts)===dayK&&h>=20)||(dateZH(e.ts)===nextDayK&&h<11);}).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    if(inW.length<2)return null;
    let max=0;for(let i=1;i<inW.length;i++){const g=(new Date(inW[i].ts)-new Date(inW[i-1].ts))/60000;if(g>max)max=g;}
    return max>=60?Math.round(max):null;
  }
  const nightDursPDF=days7.map((d,i)=>({...d,v:i===days7.length-1?null:calcNightDurPDF(d.k,days7[i+1].k)}));
  const validNightsPDF=nightDursPDF.map(d=>d.v).filter(Boolean);
  const avgNightDurPDF=validNightsPDF.length?Math.round(validNightsPDF.reduce((s,x)=>s+x,0)/validNightsPDF.length):null;

  const allFS=groupFeeds(entries.filter(e=>e.cat==="feed")).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const feedGaps=allFS.slice(1).map((e,i)=>(new Date(e.ts)-new Date(allFS[i].ts))/60000).filter(g=>g>30&&g<480);
  const avgGap=feedGaps.length?Math.round(feedGaps.reduce((s,x)=>s+x,0)/feedGaps.length):null;
  const nightFeeds=entries.filter(e=>{if(e.cat!=="feed")return false;const h=new Date(e.ts).getHours();return h>=22||h<6;});
  const avgNF=Math.round(nightFeeds.length/7*10)/10;
  const vitDays=days7.filter(({k})=>entries.some(e=>e.cat==="vitamin"&&e.vitaminDone&&dateZH(e.ts)===k)).length;
  const probDays=days7.filter(({k})=>entries.some(e=>e.cat==="probiotic"&&dateZH(e.ts)===k)).length;
  const nombrilDays=days7.filter(({k})=>entries.some(e=>e.cat==="nombril"&&dateZH(e.ts)===k)).length;

  const maxVal=Math.max(...statsRows.map(r=>Math.max(r.feeds,r.wet,r.poo)),1);
  const W=520,H=130,PX=30,PY=8,PB=36,iH=H-PY-PB;
  const n=statsRows.length,barW=(W-PX*2-(n-1)*6)/n,subW=(barW-4)/3;

  function WeightSVG(){
    if(weights.length<2)return null;
    const W2=520,H2=140,PX2=52,PY2=14,PB2=24,iW=W2-PX2*2,iH2=H2-PY2-PB2;
    const t0=new Date(weights[0].ts).getTime(),t1=new Date(weights[weights.length-1].ts).getTime(),tot=t1-t0||1;
    const minWv=Math.min(...weights.map(e=>e.weight))-0.03,maxWv=Math.max(...weights.map(e=>e.weight))+0.03;
    const tx=ts=>PX2+((new Date(ts).getTime()-t0)/tot)*iW;
    const ty=w=>PY2+(1-(w-minWv)/(maxWv-minWv))*iH2;
    const pts=weights.map(e=>({x:tx(e.ts),y:ty(e.weight),w:e.weight,ts:e.ts}));
    const path=pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
    const area=`${path} L${pts[pts.length-1].x},${PY2+iH2} L${pts[0].x},${PY2+iH2} Z`;
    return(<svg viewBox={`0 0 ${W2} ${H2}`} style={{width:"100%",display:"block"}}>
      <rect width={W2} height={H2} fill="#F7F5FB" rx={8}/>
      {Array.from({length:4},(_,i)=>minWv+(maxWv-minWv)*i/3).map((v,i)=>(
        <g key={i}><line x1={PX2} y1={ty(v)} x2={W2-PX2} y2={ty(v)} stroke="#E7E4F0" strokeDasharray="3 3"/><text x={PX2-4} y={ty(v)+4} fontSize={9} fill="#999" textAnchor="end">{v.toFixed(3)}</text></g>
      ))}
      <path d={area} fill="#1FA971" fillOpacity={0.1}/>
      <path d={path} fill="none" stroke="#1FA971" strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map((p,i)=>(<g key={i}>
        <circle cx={p.x} cy={p.y} r={5} fill="#1FA971" stroke="white" strokeWidth={1.5}/>
        <text x={p.x} y={p.y-10} fontSize={9} fill="#1FA971" textAnchor="middle" fontWeight="bold">{p.w.toFixed(3)}</text>
        <text x={p.x} y={H2-8} fontSize={8} fill="#999" textAnchor="middle">{fmtShortDate(p.ts)}</text>
      </g>))}
    </svg>);
  }

  const dateRange=`${days7[0].d.toLocaleDateString("fr-CH",{day:"numeric",month:"long"})} – ${days7[6].d.toLocaleDateString("fr-CH",{day:"numeric",month:"long",year:"numeric"})}`;
  const colors=["#EC5B7E","#3E84F0","#E8961C"];

  return(<div className="light-theme" style={{position:"fixed",inset:0,background:"#EFECF6",color:C.text,zIndex:300,overflowY:"auto"}}>
    <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"12px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
      <button onClick={onClose} style={{background:"none",border:`1.5px solid ${C.border}`,borderRadius:8,padding:"6px 14px",cursor:"pointer",fontWeight:700,color:C.muted,fontSize:13}}>← Retour</button>
      <span style={{fontWeight:700,color:C.accent,fontSize:15}}>📄 Aperçu rapport</span>
      <button onClick={()=>window.print()} style={{background:C.accent,color:"#fff",border:"none",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontWeight:700,fontSize:13}}>🖨️ Imprimer</button>
    </div>
    <div id="pdf-page" style={{background:"white",maxWidth:680,margin:"20px auto",padding:"28px 36px",boxShadow:"0 4px 24px rgba(0,0,0,0.1)",borderRadius:8}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,borderBottom:`2px solid ${C.accentLight}`,paddingBottom:12}}>
        <div>
          <div style={{fontSize:20,fontWeight:800,color:C.accent}}>🌸 Suivi de {data.babyName}</div>
          <div style={{fontSize:11,color:C.muted,marginTop:2}}>{dateRange}</div>
        </div>
        <div style={{textAlign:"right",fontSize:11,color:C.muted}}>
          {now.toLocaleDateString("fr-CH",{day:"numeric",month:"long",year:"numeric"})}<br/>
          {now.toLocaleTimeString("fr-CH",{hour:"2-digit",minute:"2-digit"})}
        </div>
      </div>

      <div style={{fontSize:12,fontWeight:700,color:C.accent,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>📊 Activités — 7 jours</div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block",marginBottom:6}}>
        <rect width={W} height={H} fill="#F7F5FB" rx={8}/>
        {/* Légende entre barres et dates */}
        {["Allait.","Pipi","Caca"].map((l,i)=>(<g key={i}><rect x={PX+i*68} y={H-14} width={8} height={8} fill={colors[i]} rx={1}/><text x={PX+i*68+11} y={H-7} fontSize={8} fill="#6E6887">{l}</text></g>))}
        {[0,Math.round(maxVal/2),maxVal].map((v,i)=>{const y=PY+(1-v/maxVal)*iH;return(<g key={i}><line x1={PX} y1={y} x2={W-PX} y2={y} stroke="#E7E4F0" strokeDasharray="3 3"/><text x={PX-4} y={y+4} fontSize={8} fill="#999" textAnchor="end">{v}</text></g>);})}
        {statsRows.map((r,i)=>{
          const x0=PX+i*(barW+6);
          return(<g key={i}>
            {[r.feeds,r.wet,r.poo].map((v,j)=>{const bh=Math.max(v/maxVal*iH,v?2:0);const bx=x0+j*(subW+1);return(<g key={j}><rect x={bx} y={PY+iH-bh} width={subW} height={bh} fill={colors[j]} rx={2} opacity={0.85}/>{v>0&&<text x={bx+subW/2} y={PY+iH-bh-2} fontSize={7} fill={colors[j]} textAnchor="middle" fontWeight="bold">{v}</text>}</g>);})}
            <text x={x0+barW/2} y={PY+iH+12} fontSize={8} fill="#6E6887" textAnchor="middle">{r.label.split(" ").slice(0,2).join(" ")}</text>
          </g>);
        })}
      </svg>

      <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,marginBottom:14}}>
        <thead><tr style={{background:C.accentLight}}>
          <th style={{padding:"5px 8px",textAlign:"left"}}>Jour</th>
          <th style={{padding:"5px 8px",textAlign:"center"}}>🤱</th>
          <th style={{padding:"5px 8px",textAlign:"center"}}>💧</th>
          <th style={{padding:"5px 8px",textAlign:"center"}}>💩</th>
          <th style={{padding:"5px 8px",textAlign:"center"}}>🌙 Nuit</th>
          <th style={{padding:"5px 8px",textAlign:"center"}}>💊</th>
        </tr></thead>
        <tbody>
          {statsRows.map((r,i)=>(<tr key={i} style={{background:i%2===0?"#F7F5FB":"white"}}>
            <td style={{padding:"4px 8px",fontWeight:600}}>{r.label}</td>
            <td style={{padding:"4px 8px",textAlign:"center"}}>{r.feeds}</td>
            <td style={{padding:"4px 8px",textAlign:"center"}}>{r.wet}</td>
            <td style={{padding:"4px 8px",textAlign:"center"}}>{r.poo}</td>
            <td style={{padding:"4px 8px",textAlign:"center",color:C.lavender,fontWeight:600}}>{nightDursPDF[i].v?durLabel(nightDursPDF[i].v):"—"}</td>
            <td style={{padding:"4px 8px",textAlign:"center",color:r.vit?C.sage:C.red,fontWeight:700}}>{r.vit?"✓":"✗"}</td>
          </tr>))}
          <tr style={{background:C.accentLight,fontWeight:700}}>
            <td style={{padding:"4px 8px"}}>Moy./jour</td>
            <td style={{padding:"4px 8px",textAlign:"center"}}>{Math.round(statsRows.reduce((s,r)=>s+r.feeds,0)/7*10)/10}</td>
            <td style={{padding:"4px 8px",textAlign:"center"}}>{Math.round(statsRows.reduce((s,r)=>s+r.wet,0)/7*10)/10}</td>
            <td style={{padding:"4px 8px",textAlign:"center"}}>{Math.round(statsRows.reduce((s,r)=>s+r.poo,0)/7*10)/10}</td>
            <td style={{padding:"4px 8px",textAlign:"center",color:C.lavender}}>{avgNightDurPDF?durLabel(avgNightDurPDF):"—"}</td>
            <td style={{padding:"4px 8px",textAlign:"center",color:vitDays<7?C.red:C.sage}}>{vitDays}/7</td>
          </tr>
        </tbody>
      </table>

      <div style={{fontSize:12,fontWeight:700,color:C.accent,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>📈 Courbe de poids</div>
      <WeightSVG/>
      {weights.length>=2&&<div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
        {[{l:"Naissance",v:`${firstW.weight} kg`,c:C.muted},{l:"Min.",v:`${minW} kg`,c:C.red},{l:"Dernier",v:`${lastW.weight} kg (${fmtShortDate(lastW.ts)})`,c:C.sage},weightGain!=null?{l:"Reprise",v:`+${weightGain} g${dailyGain?` · ${dailyGain} g/j`:""}`,c:C.sage}:null].filter(Boolean).map((item,i)=>(
          <div key={i} style={{background:"#F7F5FB",borderRadius:8,padding:"5px 10px",borderLeft:`3px solid ${item.c}`,fontSize:11}}>
            <span style={{color:C.muted}}>{item.l} : </span><strong style={{color:item.c}}>{item.v}</strong>
          </div>
        ))}
      </div>}

      <div style={{fontSize:12,fontWeight:700,color:C.accent,textTransform:"uppercase",letterSpacing:1,margin:"14px 0 8px"}}>✨ Faits marquants</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
        {avgGap&&<div style={{background:"#F7F5FB",borderRadius:8,padding:"7px 10px",borderLeft:`3px solid ${C.accent}`,fontSize:11}}>🤱 Intervalle moyen : <strong>{durLabel(avgGap)}</strong></div>}
        {avgNF>0&&<div style={{background:"#F7F5FB",borderRadius:8,padding:"7px 10px",borderLeft:`3px solid ${C.lavender}`,fontSize:11}}>🌙 Tétées nocturnes : <strong>{avgNF}/nuit</strong></div>}
        <div style={{background:"#F7F5FB",borderRadius:8,padding:"7px 10px",borderLeft:`3px solid ${vitDays<7?C.red:C.sage}`,fontSize:11}}>💊 Vitamines : <strong style={{color:vitDays<7?C.red:C.sage}}>{vitDays}/7 j</strong></div>
        {weightGain!=null&&<div style={{background:"#F7F5FB",borderRadius:8,padding:"7px 10px",borderLeft:`3px solid ${C.sage}`,fontSize:11}}>⚖️ Reprise : <strong style={{color:C.sage}}>+{weightGain} g{dailyGain?` (${dailyGain} g/j)`:""}</strong></div>}
      </div>
    </div>
    <style>{`@media print{body>*:not(#pdf-page){display:none!important;}#pdf-page{margin:0!important;box-shadow:none!important;border-radius:0!important;max-width:100%!important;padding:12px 18px!important;}@page{size:A4;margin:8mm;}}`}</style>
  </div>);
}

// ─── Rapport mensuel (aperçu HTML statique intégré) ──────────────────────────
function MonthlyReport({data,onClose}){
  const entries=data.entries;
  const now=new Date();
  const weights=entries.filter(e=>e.cat==="weight").sort((a,b)=>new Date(a.ts)-new Date(b.ts));

  // Découpe en semaines (7 jours) depuis la naissance ou depuis 4 semaines
  const birth=data.birthDate?new Date(data.birthDate):weights[0]?new Date(weights[0].ts):now;
  const totalDays=Math.min(28,Math.max(7,Math.floor((now-birth)/86400000)+1));
  const nWeeks=Math.max(1,Math.ceil(totalDays/7));

  function weekRange(i){
    const start=new Date(now.getTime()-(nWeeks-i)*7*86400000);
    const end=new Date(start.getTime()+7*86400000-1);
    return{start,end};
  }
  function inRange(ts,start,end){const t=new Date(ts);return t>=start&&t<=end;}

  const weeks=Array.from({length:nWeeks},(_,i)=>{
    const{start,end}=weekRange(i);
    const we=entries.filter(e=>inRange(e.ts,start,end));
    const feedSessions=groupFeeds(we);
    const feedsPerDay=Math.round(feedSessions.length/7*10)/10;
    const wet=Math.round(we.filter(e=>e.cat==="diaper_wet"||e.cat==="diaper_both").length/7*10)/10;
    const poo=Math.round(we.filter(e=>e.cat==="diaper_poo"||e.cat==="diaper_both").length/7*10)/10;
    const nightFeedSessions=groupFeeds(we.filter(e=>{const h=new Date(e.ts).getHours();return h>=22||h<6;}));
    const nightFeeds=Math.round(nightFeedSessions.length/7*10)/10;
    // Nuits: moyenne des plus longues pauses par nuit dans la semaine
    const nightDurs=[];
    for(let d=0;d<7;d++){
      const dayStart=new Date(start.getTime()+d*86400000);
      const ws=new Date(dayStart);ws.setHours(20,0,0,0);
      const we2=new Date(ws);we2.setDate(we2.getDate()+1);we2.setHours(11,0,0,0);
      const inW=entries.filter(e=>{const t=new Date(e.ts);return t>=ws&&t<=we2;}).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
      if(inW.length>=2){
        let max=0;
        for(let j=1;j<inW.length;j++){const g=(new Date(inW[j].ts)-new Date(inW[j-1].ts))/60000;if(g>max)max=g;}
        if(max>=60)nightDurs.push(max);
      }
    }
    const avgNightDur=nightDurs.length?Math.round(nightDurs.reduce((s,x)=>s+x,0)/nightDurs.length):null;
    const label=`S${i+1} · ${start.toLocaleDateString("fr-CH",{day:"2-digit",month:"2-digit"})}-${end.toLocaleDateString("fr-CH",{day:"2-digit",month:"2-digit"})}`;
    return{feedsPerDay,wet,poo,nightFeeds,avgNightDur,label};
  });

  const minW=weights.length?Math.min(...weights.map(e=>e.weight)):null;
  const lastW=weights.length?weights[weights.length-1]:null;
  const firstW=weights.length?weights[0]:null;
  const weightGain=minW&&lastW?Math.round((lastW.weight-minW)*1000):null;

  const first=weeks[0],last=weeks[weeks.length-1];
  const dFeed=last&&first?Math.round((last.feedsPerDay-first.feedsPerDay)*10)/10:0;
  const dPoo=last&&first?Math.round((last.poo-first.poo)*10)/10:0;
  const dNightFeeds=last&&first?Math.round((last.nightFeeds-first.nightFeeds)*10)/10:0;
  const dNightDur=last&&first&&last.avgNightDur&&first.avgNightDur?last.avgNightDur-first.avgNightDur:null;

  // SVG courbe de poids (toutes les pesées)
  function WeightSVG(){
    if(weights.length<2)return<div style={{color:"#999",fontSize:11,padding:"10px 0"}}>Pas assez de pesées pour tracer une courbe.</div>;
    const W=560,H=90,PX=48,PY=14,PB=22,iW=W-PX*2,iH=H-PY-PB;
    const t0=new Date(weights[0].ts).getTime(),t1=new Date(weights[weights.length-1].ts).getTime(),tot=t1-t0||1;
    const minWv=Math.min(...weights.map(e=>e.weight))-0.05,maxWv=Math.max(...weights.map(e=>e.weight))+0.05;
    const tx=ts=>PX+((new Date(ts).getTime()-t0)/tot)*iW;
    const ty=w=>PY+(1-(w-minWv)/(maxWv-minWv))*iH;
    const pts=weights.map(e=>({x:tx(e.ts),y:ty(e.weight),w:e.weight,ts:e.ts,isMin:e.weight===minW}));
    const path=pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
    const area=`${path} L${pts[pts.length-1].x},${PY+iH} L${pts[0].x},${PY+iH} Z`;
    return(<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block"}}>
      <rect width={W} height={H} fill="#F7F5FB" rx={6}/>
      {[minWv,(minWv+maxWv)/2,maxWv].map((v,i)=>(<g key={i}><line x1={PX} y1={ty(v)} x2={W-PX} y2={ty(v)} stroke="#E7E4F0" strokeDasharray="3 2"/><text x={PX-4} y={ty(v)+3} fontSize={8} fill="#aaa" textAnchor="end">{v.toFixed(2)}</text></g>))}
      <path d={area} fill="#1FA971" fillOpacity={0.1}/>
      <path d={path} fill="none" stroke="#1FA971" strokeWidth={2.5} strokeLinejoin="round"/>
      {pts.map((p,i)=>(<g key={i}>
        <circle cx={p.x} cy={p.y} r={p.isMin?5:4} fill={p.isMin?"#E5484D":"#1FA971"} stroke="white" strokeWidth={1.5}/>
        <text x={p.x} y={p.y-8} fontSize={8} fill={p.isMin?"#E5484D":"#1FA971"} textAnchor="middle" fontWeight="bold">{p.w.toFixed(3)}</text>
        <text x={p.x} y={H-6} fontSize={7} fill="#aaa" textAnchor="middle">{fmtShortDate(p.ts)}</text>
      </g>))}
    </svg>);
  }

  function MiniTrend({label,data,color,fmt}){
    const W=180,H=44,vals=data.filter(v=>v!=null);
    if(vals.length<2)return null;
    const mn=Math.min(...vals),mx=Math.max(...vals);
    const range=mx-mn||1;
    const step=W/(data.length-1||1);
    const pts=data.map((v,i)=>v==null?null:{x:i*step+8,y:H-8-((v-mn)/range)*(H-16)});
    const validPts=pts.filter(Boolean);
    const path=validPts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
    const delta=vals[vals.length-1]-vals[0];
    return(<div style={{background:"#F7F5FB",borderRadius:8,padding:"6px 8px"}}>
      <div style={{fontSize:9,fontWeight:700,color:"#6E6887",display:"flex",justifyContent:"space-between",marginBottom:3}}>
        <span>{label}</span><span style={{fontWeight:800,color:delta<=0?"#1FA971":"#E5484D"}}>{delta>0?"+":""}{fmt?fmt(delta):delta.toFixed(1)}</span>
      </div>
      <svg viewBox={`0 0 ${W+16} ${H}`} style={{width:"100%",display:"block"}}>
        <rect width={W+16} height={H} fill="white" rx={4}/>
        <path d={path} fill="none" stroke={color} strokeWidth={2} strokeLinejoin="round"/>
        {pts.map((p,i)=>p&&(<g key={i}>
          <circle cx={p.x} cy={p.y} r={3} fill={color}/>
          <text x={p.x} y={p.y-6} fontSize={7} fill={color} textAnchor="middle">{fmt?fmt(data[i]):data[i]}</text>
          <text x={p.x} y={H-2} fontSize={6} fill="#aaa" textAnchor="middle">S{i+1}</text>
        </g>))}
      </svg>
    </div>);
  }

  const rangeLabel=`${birth.toLocaleDateString("fr-CH",{day:"numeric",month:"long"})} – ${now.toLocaleDateString("fr-CH",{day:"numeric",month:"long",year:"numeric"})}`;

  return(<div className="light-theme" style={{position:"fixed",inset:0,background:"#EFECF6",color:C.text,zIndex:300,overflowY:"auto"}}>
    <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"12px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
      <button onClick={onClose} style={{background:"none",border:`1.5px solid ${C.border}`,borderRadius:8,padding:"6px 14px",cursor:"pointer",fontWeight:700,color:C.muted,fontSize:13}}>← Retour</button>
      <span style={{fontWeight:700,color:C.accent,fontSize:15}}>📅 Rapport mensuel</span>
      <button onClick={()=>window.print()} style={{background:C.accent,color:"#fff",border:"none",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontWeight:700,fontSize:13}}>🖨️ Imprimer</button>
    </div>

    <div id="monthly-page" style={{background:"white",maxWidth:680,margin:"20px auto",padding:"26px 34px",boxShadow:"0 4px 24px rgba(0,0,0,0.1)",borderRadius:8,fontSize:11}}>
      <div style={{display:"flex",justifyContent:"space-between",borderBottom:`2px solid ${C.accentLight}`,paddingBottom:10,marginBottom:14}}>
        <div>
          <div style={{fontSize:18,fontWeight:800,color:C.accent}}>Suivi mensuel — {data.babyName}</div>
          <div style={{fontSize:10,color:C.muted,marginTop:2}}>{rangeLabel}</div>
        </div>
        <div style={{fontSize:10,color:C.muted}}>{now.toLocaleDateString("fr-CH",{day:"numeric",month:"long",year:"numeric"})}</div>
      </div>

      <div style={{fontSize:10,fontWeight:700,color:C.accent,textTransform:"uppercase",letterSpacing:1,margin:"12px 0 6px"}}>📈 Courbe de poids</div>
      <WeightSVG/>
      {weights.length>=2&&<div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:6}}>
        <div style={{background:C.bg,borderRadius:6,padding:"3px 8px",fontSize:10,borderLeft:`3px solid ${C.sage}`}}>Naissance <strong>{firstW.weight} kg</strong></div>
        <div style={{background:C.bg,borderRadius:6,padding:"3px 8px",fontSize:10,borderLeft:`3px solid ${C.red}`}}>Minimum <strong>{minW} kg</strong></div>
        <div style={{background:C.bg,borderRadius:6,padding:"3px 8px",fontSize:10,borderLeft:`3px solid ${C.sage}`}}>Dernier <strong>{lastW.weight} kg</strong> ({fmtShortDate(lastW.ts)})</div>

      <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>

      {weeks.length>1&&<>
        <div style={{fontSize:10,fontWeight:700,color:C.accent,textTransform:"uppercase",letterSpacing:1,margin:"14px 0 6px"}}>📉 Évolution des indicateurs</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <MiniTrend label="Allaitements/jour" data={weeks.map(w=>w.feedsPerDay)} color={C.accent}/>

      <div style={{fontSize:10,fontWeight:700,color:C.accent,textTransform:"uppercase",letterSpacing:1,margin:"14px 0 6px"}}>✨ Évolution depuis le début</div>

function StatsTab({entries,data,onShowPDF,onShowMonthly}){
  const[,setTick]=useState(0);
  useEffect(()=>{
    function onVisible(){if(document.visibilityState==="visible")setTick(t=>t+1);}
    document.addEventListener("visibilitychange",onVisible);
    return()=>document.removeEventListener("visibilitychange",onVisible);
  },[]);
  const now=new Date();
  function byDay(n){const days=[];for(let i=n-1;i>=0;i--){const d=new Date(now.getTime()-i*86400000);const k=d.toLocaleDateString("fr-CH",{timeZone:"Europe/Zurich"});const label=i===0?"Auj.":i===1?"Hier":`${pad(d.getDate())}.${pad(d.getMonth()+1)}`;days.push({k,label,d});}return days;}
  const days7=byDay(7);
  const feedsByDay=days7.map(d=>({...d,v:groupFeeds(entries.filter(e=>dateZH(e.ts)===d.k)).length}));
  const wetByDay=days7.map(d=>({...d,v:entries.filter(e=>(e.cat==="diaper_wet"||e.cat==="diaper_both")&&dateZH(e.ts)===d.k).length}));
  const pooByDay=days7.map(d=>({...d,v:entries.filter(e=>(e.cat==="diaper_poo"||e.cat==="diaper_both")&&dateZH(e.ts)===d.k).length}));
  const avg=arr=>arr.length?Math.round(arr.reduce((s,x)=>s+x,0)/arr.length*10)/10:0;
  const allFS=groupFeeds(entries.filter(e=>e.cat==="feed")).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const feedGaps=allFS.slice(1).map((e,i)=>(new Date(e.ts)-new Date(allFS[i].ts))/60000).filter(g=>g>30&&g<480);
  const avgGap=feedGaps.length?Math.round(feedGaps.reduce((s,x)=>s+x,0)/feedGaps.length):null;
  const weights=entries.filter(e=>e.cat==="weight").sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const minW=weights.length?Math.min(...weights.map(e=>e.weight)):null;
  const lastW=weights.length?weights[weights.length-1]:null;
  const weightGain=minW&&lastW?Math.round((lastW.weight-minW)*1000):null;
  const minWEntry=weights.find(e=>e.weight===minW);
  const daysSince=minWEntry&&lastW?Math.round((new Date(lastW.ts)-new Date(minWEntry.ts))/86400000):null;
  const dailyGain=weightGain&&daysSince?Math.round(weightGain/daysSince):null;
  // Tétées nocturnes : sessions groupées entre 22h et 6h
  const allNightSessions=groupFeeds(entries.filter(e=>{
    if(e.cat!=="feed")return false;
    const h=new Date(e.ts).getHours();
    return h>=22||h<6;
  }));
  const nightByDay=days7.map(d=>({...d,v:allNightSessions.filter(e=>dateZH(e.ts)===d.k).length}));
  const avgNightFeeds=avg(nightByDay.map(d=>d.v));
  const vitDays=days7.filter(({k})=>entries.some(e=>e.cat==="vitamin"&&e.vitaminDone&&dateZH(e.ts)===k)).length;
  const probDays=days7.filter(({k})=>entries.some(e=>e.cat==="probiotic"&&dateZH(e.ts)===k)).length;
  const nombrilDays=days7.filter(({k})=>entries.some(e=>e.cat==="nombril"&&dateZH(e.ts)===k)).length;
  const e48a=entries.filter(e=>new Date(e.ts)>=new Date(now-48*3600000)&&new Date(e.ts)<new Date(now-24*3600000));
  const e48b=entries.filter(e=>new Date(e.ts)>=new Date(now-24*3600000));
  const trend=(cat,prev,curr)=>{const p=prev.filter(e=>e.cat===cat).length,c=curr.filter(e=>e.cat===cat).length;if(c>p)return{arrow:"↑",color:C.sage};if(c<p)return{arrow:"↓",color:C.red};return{arrow:"→",color:C.muted};};
  function calcNightDur(dayK,nextDayK){
    const inW=entries.filter(e=>{const h=new Date(e.ts).getHours();return(dateZH(e.ts)===dayK&&h>=20)||(dateZH(e.ts)===nextDayK&&h<11);}).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    if(inW.length<2)return null;
    let max=0;for(let i=1;i<inW.length;i++){const g=(new Date(inW[i].ts)-new Date(inW[i-1].ts))/60000;if(g>max)max=g;}
    return max>=60?Math.round(max):null;
  }
  const nightDurations=days7.map((d,i)=>{if(i===days7.length-1)return{...d,v:null};return{...d,v:calcNightDur(d.k,days7[i+1].k)};});
  const validNights=nightDurations.map(d=>d.v).filter(Boolean);
  const avgNightDur=validNights.length?Math.round(validNights.reduce((s,x)=>s+x,0)/validNights.length):null;

  function BarChart({data:bdata,color}){
    const m=Math.max(...bdata.map(d=>d.v),1);
    return(<div style={{display:"flex",alignItems:"flex-end",gap:6,height:78}}>
      {bdata.map((d,i)=>(<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
        <div style={{fontSize:11,color:d.v?color:C.muted,fontWeight:800}}>{d.v||""}</div>
        <div style={{width:"100%",maxWidth:30,background:color,opacity:i===bdata.length-1?1:0.35+0.45*(d.v/m),borderRadius:8,height:Math.max(d.v/m*48,d.v?6:3)}}/>
        <div style={{fontSize:10,color:i===bdata.length-1?C.text:C.muted,fontWeight:i===bdata.length-1?800:600,textAlign:"center",lineHeight:1.1}}>{d.label}</div>
      </div>))}
    </div>);
  }
  const Sec=({title,children})=>(<Card style={{padding:"16px 18px"}}><div style={{fontSize:15,fontWeight:900,marginBottom:14}}>{title}</div>{children}</Card>);
  const KV=({label,value,color,last})=>(<div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",padding:"9px 0",borderBottom:last?"none":`1px solid ${C.bg}`}}><span style={{fontSize:14,color:C.muted,fontWeight:600}}>{label}</span><span style={{fontSize:16,fontWeight:900,color:color||C.text}}>{value}</span></div>);
  const ReportBtn=({emoji,title,sub,color,bg,onClick})=>(<button className="tap" onClick={onClick} style={{flex:1,background:bg,border:"none",borderRadius:20,padding:"14px",textAlign:"left",cursor:"pointer"}}>
    <div style={{fontSize:24}}>{emoji}</div>
    <div style={{fontSize:15,fontWeight:900,color,marginTop:4}}>{title}</div>
    <div style={{fontSize:12,fontWeight:700,color:C.muted}}>{sub}</div>
  </button>);

  return(<div className="stagger" style={{display:"flex",flexDirection:"column",gap:14}}>
    <Title>Statistiques</Title>
    <div style={{display:"flex",gap:10}}>
      <ReportBtn emoji="📄" title="Rapport" sub="7 derniers jours" color={C.accent} bg={C.accentLight} onClick={onShowPDF}/>
      <ReportBtn emoji="📅" title="Rapport" sub="mensuel" color={C.lavender} bg={C.lavenderLight} onClick={onShowMonthly}/>
    </div>
    <Sec title="Tendances · 24h vs veille">
      <div style={{display:"flex",gap:8}}>
        {[["🤱","Allaitement",trend("feed",e48a,e48b)],["💧","Pipi",trend("diaper_wet",e48a,e48b)],["💩","Caca",trend("diaper_poo",e48a,e48b)]].map(([emoji,label,t])=>(
          <div key={label} style={{flex:1,background:C.bg,borderRadius:16,padding:"10px 6px",textAlign:"center"}}>
            <div style={{fontSize:20}}>{emoji}</div>
            <div style={{fontSize:24,fontWeight:900,color:t.color,lineHeight:1.2}}>{t.arrow}</div>
            <div style={{fontSize:11,color:C.muted,fontWeight:800}}>{label}</div>
          </div>
        ))}
      </div>
    </Sec>
    <Sec title="Moyennes sur 7 jours">
      <KV label="Allaitements / jour" value={avg(feedsByDay.map(d=>d.v))}/>
      <KV label="Pipi / jour" value={avg(wetByDay.map(d=>d.v))}/>
      <KV label="Caca / jour" value={avg(pooByDay.map(d=>d.v))}/>
      <KV label="Tétées nocturnes (22h-6h)" value={avgNightFeeds} last={!avgGap}/>
      {avgGap&&<KV label="Intervalle entre tétées" value={durLabel(avgGap)} last/>}
    </Sec>
    {avgNightDur&&<Sec title="Durée des nuits">
      <div style={{display:"flex",alignItems:"flex-end",gap:6,height:96,marginBottom:10}}>
        {nightDurations.map((d,i)=>{const m=Math.max(...nightDurations.map(x=>x.v||0),1);return(<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
          <div style={{fontSize:10,color:C.lavender,fontWeight:800,whiteSpace:"nowrap"}}>{d.v?durLabel(d.v):""}</div>
          <div style={{width:"100%",maxWidth:30,background:C.lavender,opacity:d.v?0.35+0.65*(d.v/m):0.12,borderRadius:8,height:d.v?Math.max(d.v/m*60,6):3}}/>
          <div style={{fontSize:10,color:C.muted,fontWeight:600,textAlign:"center",lineHeight:1.1}}>{d.label}</div>
        </div>);
        })}
      </div>
      <KV label="Moyenne" value={durLabel(avgNightDur)} color={C.lavender} last/>
    </Sec>}
    <Sec title="Allaitements par jour"><BarChart data={feedsByDay} color={C.accent}/></Sec>
    <Sec title="Pipi par jour"><BarChart data={wetByDay} color={C.sky}/></Sec>
    <Sec title="Caca par jour"><BarChart data={pooByDay} color={C.golden}/></Sec>
    {weights.length>=2&&<Sec title="Croissance">
      <KV label="Poids initial" value={`${weights[0].weight} kg`}/>
      <KV label="Poids minimum" value={`${minW} kg`} color={C.red}/>
      <KV label="Poids actuel" value={`${lastW.weight} kg`} color={C.sage} last={weightGain==null&&!dailyGain}/>
      {weightGain!=null&&<KV label="Prise de poids totale" value={`+${weightGain} g`} color={C.sage} last={!dailyGain}/>}
      {dailyGain&&<KV label="Gain moyen / jour" value={`+${dailyGain} g`} color={dailyGain>=15&&dailyGain<=40?C.sage:C.golden} last/>}
    </Sec>}
    <Sec title="Vitamines · 7 derniers jours">
      <KV label="Jours avec vitamines" value={`${vitDays}/7`} color={vitDays>=6?C.sage:vitDays>=4?C.golden:C.red} last/>
    </Sec>
    <Sec title="Faits marquants">
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {weightGain!=null&&<div style={{background:C.sageLight,borderRadius:14,padding:"11px 13px",fontSize:14,color:C.sage,fontWeight:600}}>⚖️ {data.babyName} a pris <strong>{weightGain} g</strong> depuis le minimum{dailyGain?` (${dailyGain} g/jour)`:""}</div>}
        {avgGap&&<div style={{background:C.accentLight,borderRadius:14,padding:"11px 13px",fontSize:14,color:C.accent,fontWeight:600}}>🤱 Intervalle moyen entre tétées : <strong>{durLabel(avgGap)}</strong></div>}
        {avgNightFeeds>0&&<div style={{background:C.lavenderLight,borderRadius:14,padding:"11px 13px",fontSize:14,color:C.lavender,fontWeight:600}}>🌙 <strong>{avgNightFeeds}</strong> tétée{avgNightFeeds>1?"s":""} nocturne{avgNightFeeds>1?"s":""} par nuit</div>}
        {vitDays<7&&<div style={{background:C.redLight,borderRadius:14,padding:"11px 13px",fontSize:14,color:C.red,fontWeight:600}}>💊 Vitamines oubliées <strong>{7-vitDays} jour{7-vitDays>1?"s":""}</strong> cette semaine</div>}
      </div>
    </Sec>
  </div>);
}

function Settings({data,onUpdate,syncStatus,mode,onMode}){
  const[name,setName]=useState(data.babyName);
  const[birth,setBirth]=useState(data.birthDate);
  const[author,setAuthor]=useState(()=>{try{return localStorage.getItem("bt_author")||"";}catch{return"";}});
  function saveAuthor(v){setAuthor(v);try{localStorage.setItem("bt_author",v);}catch{}}
  const sc={ok:{bg:C.sageLight,c:C.sage,t:"✓ Synchronisé"},syncing:{bg:C.goldenLight,c:C.golden,t:"Synchronisation…"},error:{bg:C.redLight,c:C.red,t:"⚠️ Erreur de connexion"},offline:{bg:C.neutralLight,c:C.muted,t:"Hors ligne"}}[syncStatus]||{};
  return(<div className="stagger" style={{display:"flex",flexDirection:"column",gap:14}}>
    <Title action={<span style={{background:sc.bg,color:sc.c,borderRadius:999,padding:"4px 10px",fontSize:12,fontWeight:800}}>{sc.t}</span>}>Réglages</Title>

      <Form>

        <Inp label="Votre prénom (sur ce téléphone)" value={author} onChange={e=>saveAuthor(e.target.value)} placeholder="ex: Papa"/>

          <Label>Affichage sur ce téléphone</Label>
          <ModeSwitch mode={mode} onChange={onMode} wide/>

// Interrupteur glissant Essentiel / Complet
function ModeSwitch({mode,onChange,wide}){
  const opts=[["essentiel","Essentiel"],["complet","Complet"]];
  const i=mode==="essentiel"?0:1;
  return(<div style={{position:"relative",display:"grid",gridTemplateColumns:"1fr 1fr",background:"var(--track)",borderRadius:999,padding:3,width:wide?"100%":176}}>
    <div style={{position:"absolute",top:3,bottom:3,left:3,width:"calc(50% - 3px)",borderRadius:999,background:C.surface,boxShadow:"0 2px 8px rgba(24,18,48,.14)",transform:`translateX(${i*100}%)`,transition:"transform .3s cubic-bezier(.3,1.3,.5,1)"}}/>
    {opts.map(([m,l])=>(<button key={m} onClick={()=>onChange(m)} style={{position:"relative",zIndex:1,background:"none",border:"none",padding:wide?"10px 0":"7px 0",fontSize:13,fontWeight:900,color:mode===m?C.accent:C.muted,cursor:"pointer",transition:"color .2s"}}>{l}</button>))}
  </div>);
}

function App(){
  const[data,setData]=useState(DEFAULT);
  const[tab,setTab]=useState("home");
  const[modal,setModal]=useState(null);
  const[syncStatus,setSyncStatus]=useState("syncing");
  const[showPDF,setShowPDF]=useState(false);
  const[showMonthly,setShowMonthly]=useState(false);
  const[toast,setToast]=useState(null);
  const[mode,setMode]=useState(()=>{try{return localStorage.getItem("bt_mode")||"complet";}catch{return"complet";}});
  const simple=mode==="essentiel";
  function changeMode(m){setMode(m);try{localStorage.setItem("bt_mode",m);}catch{}if(m==="essentiel"&&(tab==="stats"||tab==="weight"))setTab("home");}
  const saveTimer=useRef(null);
  const toastTimer=useRef(null);
  function showToast(text){clearTimeout(toastTimer.current);setToast({text,k:Date.now()});toastTimer.current=setTimeout(()=>setToast(null),1900);}

  useEffect(()=>{
    fbRead().then(remote=>{
      if(remote&&remote.entries&&remote.entries.length>0){setData(remote);setSyncStatus("ok");}
      else{fbWrite(DEFAULT).then(()=>setSyncStatus("ok"));}
    }).catch(()=>setSyncStatus("offline"));
  },[]);

  useEffect(()=>{
    function syncNow(){
      fbRead().then(remote=>{
        if(!remote)return;
        setData(prev=>{
          const ids=new Set(prev.entries.map(e=>e.id));
          const newE=remote.entries.filter(e=>!ids.has(e.id));
          if(!newE.length&&remote.babyName===prev.babyName)return prev;
          return{...remote,entries:[...prev.entries,...newE].sort((a,b)=>new Date(b.ts)-new Date(a.ts))};
        });
        setSyncStatus("ok");
      }).catch(()=>setSyncStatus("offline"));
    }
    function onVisible(){if(document.visibilityState==="visible")syncNow();}
    document.addEventListener("visibilitychange",onVisible);
    const id=setInterval(()=>{if(document.visibilityState==="visible")syncNow();},2*60*1000);
    return()=>{document.removeEventListener("visibilitychange",onVisible);clearInterval(id);};
  },[]);

  function persist(next){setData(next);setSyncStatus("syncing");clearTimeout(saveTimer.current);saveTimer.current=setTimeout(()=>{fbWrite(next).then(()=>setSyncStatus("ok")).catch(()=>setSyncStatus("error"));},800);}
  const author=()=>{try{return localStorage.getItem("bt_author")||"";}catch{return"";}};
  function addEntry(payload){const entry={id:Date.now()+Math.random(),...payload,author:author()||undefined};persist({...data,entries:[entry,...data.entries]});setModal(null);const c=CATS[payload.cat];showToast(`✓ Enregistré · ${c?c.emoji+" "+c.label:""}`);}
  function editEntry(payload){persist({...data,entries:data.entries.map(e=>e.id===modal.entry.id?{...e,...payload}:e)});setModal(null);showToast("✓ Modifié");}
  function deleteEntry(id){persist({...data,entries:data.entries.filter(e=>e.id!==id)});showToast("Entrée supprimée");}
  function updateMeta(patch){persist({...data,...patch});showToast("✓ Sauvegardé");}
  const isEditing=modal&&modal.entry;
  const mType=modal?.type,mEntry=modal?.entry;
  function handleSave(p){isEditing?editEntry(p):addEntry(p);}
  function openModal(cat,preset){setModal({type:cat,preset});}
  function openEdit(entry){setModal({type:entry.cat,entry});}
  function goTab(t){if(t===tab)return;setTab(t);window.scrollTo({top:0});}

  function ageLabel(){
    if(!data.birthDate)return null;
    const days=Math.floor((Date.now()-new Date(data.birthDate))/86400000);
    if(days<=30)return`${days} jour${days>1?"s":""}`;
    if(days<56)return`${Math.floor(days/7)} semaine${Math.floor(days/7)>1?"s":""}`;
    return`${Math.floor(days/30)} mois`;
  }

  const QUICK=[
    "feed","diaper_wet","diaper_poo","diaper_both",
    "sleep","vitamin","nez","pump",
    "weight","temperature","bath","note",
  ];
  const QUICK_ESSENTIEL=[
    {cat:"feed",label:"Sein gauche",emoji:"🤱",preset:{side:"Gauche"}},
    {cat:"feed",label:"Sein droit",emoji:"🤱",preset:{side:"Droit"}},
    {cat:"diaper_wet"},
    {cat:"diaper_both"},
    {cat:"vitamin"},
  ];
  const TABS=[["home","🏠","Accueil"],["journal","📋","Journal"],["stats","📊","Stats"],["weight","📈","Courbe"],["settings","⚙️","Réglages"]].filter(([t])=>!simple||t!=="stats"&&t!=="weight");
  const SIMPLE_CATS=["vitamin","bath","mood","note","nombril","nez","probiotic"];
  const sorted=[...data.entries].sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  const nRecent=simple?3:5;
  const syncColor={ok:C.sage,syncing:C.golden,error:C.red,offline:"#A8A3BD"}[syncStatus]||C.golden;

  return(<div style={{background:"radial-gradient(700px 380px at 0% -5%, var(--glow1), transparent 70%), radial-gradient(600px 360px at 105% 8%, var(--glow2), transparent 70%), var(--bg)",backgroundRepeat:"no-repeat",minHeight:"100vh",color:C.text}}>
    {showPDF&&<PDFReport data={data} onClose={()=>setShowPDF(false)}/>}
    {showMonthly&&<MonthlyReport data={data} onClose={()=>setShowMonthly(false)}/>}

    {/* En-tête */}
    <div style={{background:"var(--glass)",backdropFilter:"saturate(1.6) blur(16px)",WebkitBackdropFilter:"saturate(1.6) blur(16px)",borderBottom:"1px solid var(--hairline)",padding:"calc(12px + env(safe-area-inset-top)) 16px 12px",position:"sticky",top:0,zIndex:40}}>
      <div style={{maxWidth:480,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
          <div style={{width:44,height:44,borderRadius:16,background:"linear-gradient(135deg,#FF8FAB,#8662F0)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0,boxShadow:"0 8px 18px -8px rgba(134,98,240,.8)"}}>🌸</div>
          <div style={{minWidth:0}}>
            <div style={{fontSize:22,fontWeight:800,letterSpacing:-.6,lineHeight:1.1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{data.babyName}</div>
            <div style={{fontSize:12,color:C.muted,fontWeight:700,display:"flex",alignItems:"center",gap:6,marginTop:2}}>
              {ageLabel()}
              <span title={syncStatus} style={{width:7,height:7,borderRadius:4,background:syncColor,display:"inline-block",animation:syncStatus==="syncing"?"pulse 1s ease infinite":"none"}}/>
            </div>
          </div>
        </div>
        <ModeSwitch mode={mode} onChange={changeMode}/>
      </div>
    </div>

    {/* Contenu */}
    <div key={tab+mode} className="page" style={{maxWidth:480,margin:"0 auto",padding:"18px 16px calc(120px + env(safe-area-inset-bottom))"}}>
      {tab==="home"&&(<div style={{display:"flex",flexDirection:"column",gap:24}}>
        <TodayStats entries={data.entries} onEdit={openEdit} onDelete={deleteEntry} onAdd={openModal} simple={simple}/>
        <div>
          <Title>Ajouter</Title>
          <div className="stagger" style={{display:"grid",gridTemplateColumns:simple?"repeat(2,1fr)":"repeat(4,1fr)",gap:simple?10:8}}>
            {simple?QUICK_ESSENTIEL.map((q,i)=>{const c=CATS[q.cat];return(
              <button key={i} className="tap" onClick={()=>openModal(q.cat,q.preset)} style={{gridColumn:i===QUICK_ESSENTIEL.length-1&&QUICK_ESSENTIEL.length%2?"span 2":undefined,background:C.surface,border:"none",borderRadius:22,padding:"16px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,boxShadow:C.shadow,textAlign:"left"}}>
                <span style={{width:48,height:48,borderRadius:16,background:c.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:eSize(q.emoji||c.emoji,26),whiteSpace:"nowrap",flexShrink:0}}>{q.emoji||c.emoji}</span>
                <span style={{fontSize:15,color:C.text,fontWeight:900,lineHeight:1.15}}>{q.label||c.label}</span>
              </button>
            );}):QUICK.map(cat=>{const c=CATS[cat];return(
              <button key={cat} className="tap" onClick={()=>openModal(cat)} style={{background:C.surface,border:"none",borderRadius:18,padding:"12px 4px 10px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:6,boxShadow:C.shadow}}>
                <span style={{width:40,height:40,borderRadius:13,background:c.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:eSize(c.emoji,20),whiteSpace:"nowrap"}}>{c.emoji}</span>
                <span style={{fontSize:11,color:C.text,fontWeight:800,textAlign:"center",lineHeight:1.15}}>{c.label}</span>
              </button>
            );})}
          </div>
        </div>
        {sorted.length>0&&(<div>
          <Title action={sorted.length>nRecent&&<button className="tap" onClick={()=>goTab("journal")} style={{background:"none",border:"none",color:C.accent,fontWeight:800,cursor:"pointer",fontSize:14}}>Tout voir ›</button>}>Récent</Title>
          <EntryList entries={sorted.slice(0,nRecent)} onDelete={deleteEntry} onEdit={openEdit}/>
        </div>)}
      </div>)}
      {tab==="journal"&&<Journal entries={data.entries} onDelete={deleteEntry} onEdit={openEdit}/>}
      {tab==="stats"&&<StatsTab entries={data.entries} data={data} onShowPDF={()=>setShowPDF(true)} onShowMonthly={()=>setShowMonthly(true)}/>}
      {tab==="weight"&&<WeightChart entries={data.entries} onAdd={()=>openModal("weight")}/>}
      {tab==="settings"&&<Settings data={data} onUpdate={updateMeta} syncStatus={syncStatus} mode={mode} onMode={changeMode}/>}
    </div>

    {/* Navigation */}
    <div style={{position:"fixed",left:12,right:12,bottom:"calc(10px + env(safe-area-inset-bottom))",zIndex:50,display:"flex",justifyContent:"center",pointerEvents:"none"}}>
      <div style={{pointerEvents:"auto",width:"100%",maxWidth:456,display:"flex",gap:4,padding:6,background:"var(--nav)",backdropFilter:"saturate(1.8) blur(20px)",WebkitBackdropFilter:"saturate(1.8) blur(20px)",borderRadius:28,border:"1px solid rgba(255,255,255,.08)",boxShadow:"0 12px 32px -10px rgba(24,18,48,.28),0 2px 6px rgba(24,18,48,.06)"}}>
        {TABS.map(([t,,label])=>{const on=tab===t;return(
          <button key={t} className="tap" onClick={()=>goTab(t)} style={{flex:1,background:on?C.accent:"transparent",border:"none",borderRadius:22,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"9px 0 7px",boxShadow:on?"0 8px 18px -8px rgba(236,91,126,.9)":"none",color:on?"#fff":"rgba(255,255,255,.55)",fontWeight:700,fontSize:11,transition:"background-color .25s, color .25s"}}>
            <Icon name={t==="home"?"home":t} size={21}/>{label}
          </button>
        );})}
      </div>
    </div>

    {/* Confirmation */}
    {toast&&<div key={toast.k} style={{position:"fixed",left:"50%",bottom:"calc(96px + env(safe-area-inset-bottom))",background:C.text,color:"#fff",padding:"11px 18px",borderRadius:999,fontWeight:800,fontSize:14,zIndex:250,animation:"toast 1.9s ease both",boxShadow:"0 10px 24px -8px rgba(24,18,48,.5)",whiteSpace:"nowrap",pointerEvents:"none"}}>{toast.text}</div>}

    {/* Formulaires */}
    {modal&&(
      <Sheet key={modal.entry?.id||modal.type} title={isEditing?<>✏️ Modifier · {CATS[mType]?.label}</>:<>{CATS[mType]?.emoji} {mType==="feed"&&modal.preset?.side?`Sein ${modal.preset.side.toLowerCase()}`:CATS[mType]?.label}</>} onClose={()=>setModal(null)}>
        {mType==="feed"&&<FeedForm onSave={handleSave} initial={mEntry} simple={simple} preset={modal.preset}/>}
        {mType==="pump"&&<PumpForm onSave={handleSave} initial={mEntry}/>}
        {(mType==="diaper_wet"||mType==="diaper_poo"||mType==="diaper_both")&&<DiaperForm type={mType} onSave={handleSave} initial={mEntry} simple={simple}/>}
        {mType==="sleep"&&<SleepForm onSave={handleSave} initial={mEntry}/>}
        {mType==="weight"&&<WeightForm onSave={handleSave} initial={mEntry}/>}
        {mType==="temperature"&&<TempForm onSave={handleSave} initial={mEntry}/>}
        {SIMPLE_CATS.includes(mType)&&<SimpleForm cat={mType} color={CATS[mType].color} onSave={handleSave} initial={mEntry}/>}
      </Sheet>
    )}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
